<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Creator Pro</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  
</head>
<body>

<div class="container">

    <h1>📄 CV Creator Pro</h1>

    <p class="title">
        Crée un CV professionnel en quelques secondes
    </p>

    <form action="/generer" method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label>Nom</label>
            <input type="text" name="nom" required>
        </div>

        <div class="form-group">
            <label>Prénom</label>
            <input type="text" name="prenom" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Téléphone</label>
            <input type="text" name="telephone">
        </div>

        <div class="form-group">
            <label>Adresse</label>
            <input type="text" name="adresse">
        </div>

        <div class="form-group">
            <label>Profil</label>
            <textarea name="profil"></textarea>
        </div>

        <div class="form-group">
            <label>Compétences</label>
            <textarea name="competences"></textarea>
        </div>

        <div class="form-group">
            <label>Expérience</label>
            <textarea name="experience"></textarea>
        </div>

        <div class="form-group">
            <label>Formation</label>
            <textarea name="formation"></textarea>
        </div>

        <div class="form-group">
            <label>Langues</label>
            <textarea name="langues"></textarea>
        </div>

        <div class="form-group">
            <label>Centres d'intérêt</label>
            <textarea name="interets"></textarea>
        </div>

        <div class="form-group">
            <label>🎨 Thème</label>
            <select name="theme">
                <option value="bleu">Bleu Pro</option>
                <option value="vert">Vert Moderne</option>
                <option value="sombre">Dark Mode</option>
            </select>
        </div>

        <div class="form-group">
            <label>📷 Photo de profil</label>
            <input type="file" name="photo">
        </div>

        <button type="submit">
            🚀 Générer mon CV
        </button>

    </form>

</div>

</body>
</html>
